<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Pantry Relay | Atlanta grocery rescue</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./status.css" />
    <link rel="stylesheet" href="./recipient.css" />

  <body>
    <a class="skip-link" href="#workspace">Skip to workspace</a>
    <header class="site-header">
      <a class="brand" href="/?role=donor" aria-label="Pantry Relay donor home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Pantry Relay</span>

      <div class="pilot-label"><span aria-hidden="true"></span>Atlanta retail rescue pilot</div>

    <nav class="role-nav" aria-label="Demo role">
      <button type="button" data-role="donor">Donor</button>
      <button type="button" data-role="recipient">Recipient</button>
      <button type="button" data-role="ops">Coordinator</button>

    <main id="workspace" tabindex="-1"></main>

    <footer>
      <p><strong>Demo boundaries:</strong> Notifications are simulated. Recipient operations are generated seed data, locations may be approximate ZIP centroids, and live capacity must be reconfirmed.</p>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
